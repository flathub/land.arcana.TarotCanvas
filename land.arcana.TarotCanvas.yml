app-id: land.arcana.TarotCanvas
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: tarot-canvas
finish-args:
  - --share=network # Needed to download reference decks
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - python3-modules.yaml
  - name: tarot-canvas
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/land.arcana.TarotCanvas.desktop ${FLATPAK_DEST}/share/applications/land.arcana.TarotCanvas.desktop
      - install -Dm644 packaging/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/land.arcana.TarotCanvas.svg
      - install -Dm644 tarot_canvas/resources/land.arcana.TarotCanvas.appdata.xml
        ${FLATPAK_DEST}/share/metainfo/land.arcana.TarotCanvas.metainfo.xml

    sources:
      - type: archive
        url: https://github.com/arcanaland/tarot-canvas/releases/download/v1.6.1/tarot-canvas-1.6.1.tar.gz
        sha256: 33f9bbfd56eee0d6e2cc8acd4a6fde3a158a25f7455f0a10675c6867feda2def

        x-checker-data:
          type: json
          url: https://api.github.com/repos/arcanaland/tarot-canvas/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="tarot-canvas-" + $version + ".tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true

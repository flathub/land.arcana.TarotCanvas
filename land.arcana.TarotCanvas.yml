app-id: land.arcana.TarotCanvas
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: tarot-canvas
rename-icon: icon
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
finish-args:
  - --share=network # Needed to download reference decks
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - python3-modules.yaml
  - name: tarot-canvas
    buildsystem: simple
    build-commands:
      - bash packaging/flatpak-build.sh

    sources:
      - type: archive
        url: https://github.com/arcanaland/tarot-canvas/releases/download/v1.10.0/tarot-canvas-1.10.0.tar.gz
        sha256: 3c965af488dd5dd9187e0ecaf420bbb09c4bc7bc3dd69565b4b4f1adb4405ab3

        x-checker-data:
          type: json
          url: https://api.github.com/repos/arcanaland/tarot-canvas/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="tarot-canvas-" + $version + ".tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true

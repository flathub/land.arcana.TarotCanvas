app-id: land.arcana.TarotCanvas
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: tarot-canvas
rename-icon: icon
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
finish-args:
  - --share=network # Needed to download reference decks
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - python3-modules.yaml
  - name: tarot-canvas
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 packaging/icon.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm644 tarot_canvas/resources/${FLATPAK_ID}.appdata.xml -t ${FLATPAK_DEST}/share/metainfo/

    sources:
      - type: archive
        url: https://github.com/arcanaland/tarot-canvas/releases/download/v1.7.0/tarot-canvas-1.7.0.tar.gz
        sha256: 2247cc27ce416bf058a5f70fe766f10c46203f05431788693f2a40170bd1311c

        x-checker-data:
          type: json
          url: https://api.github.com/repos/arcanaland/tarot-canvas/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="tarot-canvas-" + $version + ".tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true

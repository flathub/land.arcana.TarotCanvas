app-id: land.arcana.TarotCanvas
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: tarot-canvas
finish-args:
  - --share=network # Needed to download reference decks
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - python3-modules.yaml
  - name: tarot-canvas
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/land.arcana.TarotCanvas.desktop ${FLATPAK_DEST}/share/applications/land.arcana.TarotCanvas.desktop
      - install -Dm644 packaging/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/land.arcana.TarotCanvas.svg
      - install -Dm644 packaging/land.arcana.TarotCanvas.appdata.xml ${FLATPAK_DEST}/share/metainfo/land.arcana.TarotCanvas.metainfo.xml

    sources:
      - type: archive
        url: https://github.com/arcanaland/tarot-canvas/releases/download/v1.3.0/tarot-canvas-1.3.0.tar.gz
        sha256: 3c4c96086e43df3ba01099c9fb821f49d34a65d9c24995f363cf0bd5d68f2b24

        x-checker-data:
          type: json
          url: https://api.github.com/repos/arcanaland/tarot-canvas/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="tarot-canvas-" + $version + ".tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true
